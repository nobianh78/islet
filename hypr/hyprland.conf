# Islet – cấu hình Hyprland mặc định
# Màu lấy từ logo: tím #8B7CFF, hồng #FF6B97, mực #07070F

monitor = , preferred, auto, 1

$shell = qs -p ~/.config/islet/shell
$terminal = kitty
$browser = firefox
$files = nautilus

exec-once = $shell
exec-once = hyprpaper

env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORM, wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(8b7cffee) rgba(ff6b97ee) 45deg
    col.inactive_border = rgba(ffffff14)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 18
    active_opacity = 0.97
    inactive_opacity = 0.90

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        vibrancy = 0.25
        popups = true
    }

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000066)
        offset = 0 10
    }

    dim_inactive = false
}

# Chuyển động: nảy nhẹ khi mở, mượt khi đóng, trượt mờ khi đổi workspace.
animations {
    enabled = true

    bezier = spring,  0.34, 1.56, 0.64, 1
    bezier = smooth,  0.22, 1, 0.36, 1
    bezier = snappy,  0.2, 0.9, 0.1, 1.05
    bezier = linear,  0, 0, 1, 1

    animation = windowsIn,   1, 5, spring, popin 82%
    animation = windowsOut,  1, 4, smooth, popin 88%
    animation = windowsMove, 1, 5, snappy
    animation = fade,        1, 4, smooth
    animation = fadeOut,     1, 3, smooth
    animation = border,      1, 8, smooth
    animation = borderangle, 1, 80, linear, loop
    animation = layersIn,    1, 4, spring, popin 92%
    animation = layersOut,   1, 3, smooth, fade
    animation = workspaces,  1, 6, smooth, slidefade 18%
    animation = specialWorkspace, 1, 5, spring, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0a0a14)
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $files
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod SHIFT, M, exit

# Island
bind = $mod, I, exec, qs -p ~/.config/islet/shell ipc call island toggle

# Media + âm lượng (island tự hiện thanh âm lượng)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
