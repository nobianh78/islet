# Islet – theme kitty: kính mờ tối, màu theo logo
font_family      JetBrainsMono Nerd Font
font_size        11.5
# lề trên 26pt (~34px) chừa chỗ cho ba chấm + tên cửa sổ của Islet
window_padding_width 26 14 12 14
background_opacity 0.82
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_blink_interval 0.6

foreground #E8E6F5
background #0A0A14
selection_background #8B7CFF
selection_foreground #07070F
cursor #FF6B97
url_color #5EEAD4

# đen / đỏ / xanh lá / vàng / xanh dương / tím / xanh ngọc / trắng
color0  #1A1A2A
color8  #4A4A66
color1  #FF6A6A
color9  #FF8A8A
color2  #4ADE80
color10 #86EFAC
color3  #FFB547
color11 #FFD08A
color4  #7C9CFF
color12 #A5B8FF
color5  #8B7CFF
color13 #B3A9FF
color6  #5EEAD4
color14 #99F6E4
color7  #D4D2E3
color15 #FFFFFF

# Cửa sổ nổi: kích thước mở mặc định
remember_window_size no
initial_window_width  96c
initial_window_height 28c
