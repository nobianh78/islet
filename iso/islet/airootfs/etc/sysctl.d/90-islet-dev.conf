# Islet: tinh chỉnh cho lập trình
# VS Code / Zed / webpack / vite theo dõi nhiều tệp → tránh lỗi "ENOSPC: System limit for number of file watchers reached"
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
# Elasticsearch, Docker, một số game / IDE cần nhiều vùng nhớ ánh xạ
vm.max_map_count = 1048576
# ưu tiên RAM nén (zram) trước khi đẩy ra đĩa
vm.swappiness = 100
