# Islet – prompt Starship (tím · hồng · xanh ngọc)
add_newline = true
format = """$username$hostname$directory$git_branch$git_status$nodejs$python$rust$golang$java$php$docker_context$cmd_duration
$character"""

# tên máy chỉ hiện khi đang ở máy khác (SSH) — ở máy mình thì prompt gọn
[username]
style_user = "#8E8E93"
format = "[$user]($style)[@](#4A4A66)"
show_always = false
[hostname]
ssh_only = true
style = "#5EEAD4"
format = "[$hostname]($style) "

[directory]
style = "bold #8B7CFF"
format = "[\uf07b $path]($style)[$read_only]($read_only_style) "
read_only = " \uf023"
read_only_style = "#FF6A6A"
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"

[git_branch]
symbol = " "
style = "bold #FF6B97"
format = "[$symbol$branch]($style) "

[git_status]
style = "#FFB547"
format = '([$all_status$ahead_behind]($style) )'

[character]
success_symbol = "[❯](bold #5EEAD4)"
error_symbol = "[❯](bold #FF6A6A)"

[cmd_duration]
min_time = 2000
style = "#8E8E93"
format = "[⏱ $duration]($style) "

[nodejs]
format = "[ $version](#FFD45C) "
[python]
format = '[ $version( \($virtualenv\))](#4BA3FF) '
[rust]
format = "[ $version](#FF8A5C) "
[golang]
format = "[ $version](#4BE3E8) "
[java]
format = "[ $version](#FF6B6B) "
[php]
format = "[ $version](#A99CFF) "
